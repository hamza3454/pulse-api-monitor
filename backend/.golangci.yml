version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose    # unclosed HTTP response bodies (matters a lot for the worker)
    - errorlint    # errors.Is/As instead of == and type assertions
    - misspell
    - unconvert
    - noctx        # HTTP requests must carry a context

formatters:
  enable:
    - gofmt
