name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          working-directory: backend

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

  migrations:
    name: Migrations (up / down / up)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgres://pulse:pulse@localhost:5432/pulse?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      # Proves every migration applies cleanly, can be fully rolled back, and
      # can be re-applied. Catches broken or irreversible migrations in a PR.
      - name: Apply migrations
        run: |
          docker run --rm --network host -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$DB_URL" up

      - name: Roll back all migrations
        run: |
          docker run --rm --network host -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$DB_URL" down -all

      - name: Re-apply migrations
        run: |
          docker run --rm --network host -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$DB_URL" up